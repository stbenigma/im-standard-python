        <script>
		function initSVGZoom() {
			var shifted = false
			var zoomchange = 0.85
			
				
					
					panZoomDiagDIAG79 = svgPanZoom('#DIAG79-SVG', {
					panEnabled: true,
					controlIconsEnabled: true,
					mouseWheelZoomEnabled: true,
					zoomEnabled: false,
					onZoom: function(e){
						if(e < zoomchange) {
							$('#DIAG79-SVG a[href*="#ATTR"]').hide();
							$('#DIAG79-SVG a[href*="#COLU"]').hide();
						} else {
							$('#DIAG79-SVG a[href*="#ATTR"]').show();
							$('#DIAG79-SVG a[href*="#COLU"]').show();
						}
					}
					});
				
				$(document).on('keyup keydown', function(e){
				shifted = e.shiftKey;
				
					if(shifted) {
						panZoomDiagDIAG79.enableZoom();
					} else {
						panZoomDiagDIAG79.disableZoom();
					}
				
				} );
			
		}

		$(document).ready(function() {
			$(window).scroll(function() {
				if ($(this).scrollTop() > 700) {
					$('#btnTop').fadeIn();
				} else {
					$('#btnTop').fadeOut();
				}
			});
			// scroll content to top by clicking on button
			$('#btnTop').click(function() {
				$('body,html').animate({
					scrollTop: 0
				}, 400);
				return false;
			});

			$tblshow();
			initSVGZoom();
		});
	</script>
