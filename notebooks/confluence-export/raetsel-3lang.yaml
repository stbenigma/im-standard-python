# If the confluence: key is missing, the publisher works in offline mode
xconfluence:
  apiurl: 'https://fyayc-sandbox.atlassian.net'
  space: 'QUIZ'
  rootpage : 'Dokumentation'
  username: 'fyayc-sandbox@gmx.net'
  password: 'v1AD9yqDlmnHJAjYc8mh599B'
  cooldown: 0.01

  # Abort processing if pages with same title exist outside of the specified document root
  cautious: false


# datasource
#source: /Users/bue/dev/fyyccim-refmodels/raetsel-3lang/DB/raetsel-3lang.json
source: testdata/raetsel-3lang.json

# translations to _publishable
# first language listed here is not placed in a language subfolder
# and titles will not be suffixed
languages:
  - 'de'
  - 'en'
  - 'fr'

locale: ./locale

# output structure
content:

  entities:
    title: Entities
    template: entity.templ.html
    labels:
      - entity
      - IM

    content:
      attributes:
        title: Attributes
        template: attribute.templ.html
        labels:
          - attribute
          - IM

  systems:
    title: Systems
    template: system.templ.html
    labels:
      - system
      - DM

    content:
      tables:
        title: Tables
        template: table.templ.html
        manual-documentation:
          template: children.templ.html
          title-format: '{parent_title} - Table-Documentation'
          labels:
            - table
            - DM
            - documentation
            - manual
        labels:
          - table
          - DM

        content:
          columns:
            title: Columns
            template: column.templ.html
            manual-documentation:
              template: manual-documentation.templ.html
              labels:
                - column
                - DM
                - manual
                - documentation
            labels:
              - column
              - DM

  documents:
    title: Documents
    template: document.templ.html
    labels:
      - document
      - IM

  diagrams:
    title: Diagrams
    template: diagram.templ.html
    labels:
      - diagram
      - IM

  domains:
    title: Domains
    template: domain.templ.html
    filter: "'DER' in item.get('origin','') == False"
    labels:
      - domain
      - IM