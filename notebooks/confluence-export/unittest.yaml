confluence:
  apiurl: 'https://fyayc-sandbox.atlassian.net'
  space: 'PS'
  rootpage : 'Unittest root page'
  username: 'fyayc-sandbox@gmx.net'
  password: 'v1AD9yqDlmnHJAjYc8mh599B'
  # sleep time in seconds between element interactions. larger models have around 5000 elements
  # x 2 (read, write)  => 2.5h sleep time for one run
  slowdown: 0.5

# datasource
json: testdata/IM_PIM_FYAYC.json

# translations to publish
# first language listed here is not placed in a language subfolder
# and titles will not be suffixed
languages:
  - 'de'
#  - 'en'

# output structure
content:
  systems:
    title: Systeme
    template: system.templ.html
    labels:
      - system
      - DM
      - generated

    content:
      tables:
        title: Tabellen
        template: table.templ.html
        manual-documentation:
          template: children.templ.html
          title-postfix: ' - TOC'
          labels:
            - table
            - DM
            - toc
        labels:
          - table
          - DM
          - generated

        content:
          columns:
            title: Spalten
            template: column.templ.html
            manual-documentation:
              template: manual-documentation.templ.html
              labels:
                - column
                - DM
                - manual
                - documentation
            labels:
              - column
              - DM
              - generated

  entities:
    title: Entitäten
    template: entity.templ.html
    labels:
      - entity
      - IM
      - generated

    content:
      attributes:
        title: Attribute
        template: attribute.templ.html
        labels:
          - attribute
          - IM
          - generated

  domains:
    title: Domänen
    template: domain.templ.html
    labels:
      - domain
      - IM
      - generated

  documents:
    title: Dokumente
    template: document.templ.html
    labels:
      - domain
      - IM
      - generated