      label: Source-lov allows values addition
      title: flag for lovs in source system
      order: 6
      baseType: STRING
      group: SOURCE
    SOURCE-DIMENSIONLINK:
      label: Source-Dimensionlink
      title: dimension in source system
      order: 7
      baseType: STRING
      group: SOURCE

DataDomain:
  groups:
    STEP:
      label: Step properties
      order: 1
    SOURCE:
      label: Source system Attributes
      order: 2
      
  properties:
    stereotype:   
      label: Zielsystem
      labelEn: Targetsystem
      defaultValue: STANDARD
      literals:
        STANDARD:
          label: Standard dataspot
        STIBO:
          label: Stibo-step domain
          customProperties:
            DIMENSIONREF:
              label: Step Dimension ref
              title: Attribute Dimension Ref ID
              order: 6
              baseType: STRING
              group: STEP
            ATTRGRPREF:
              label: Step Attr. group ref
              title: AttributeGroup Ref ID 
              order: 7
              cardinality: MANY
              baseType: STRING
              group: STEP
            ATTRMAND:
              label: Step mandatory
              title: Attribute must have a value
              order: 10
              baseType: BOOLEAN
              group: STEP
            ATTRCALC:
              label: Step calcualted
              title: Attribute calculated from other attributes
              order: 11
              baseType: BOOLEAN
              group: STEP
            ATTRMULTIVALUE:
              label: Step multivalue
              title: a multivalued attribute can take many values of the same datatype
              baseType: BOOLEAN
              order: 12
              group: STEP
            ATTRMULTILANG:
              label: Step mehrsprachig
              labelEn: Step multilingual
              title: multilingual attribute value. (derived from dimension ref:language)
              baseType: BOOLEAN
              order: 13
              group: STEP
            ATTRFULLTEXT:
              label: Step Fulltext search
              title: Attribute FullText
              order: 14
              baseType: BOOLEAN
              group: STEP
            ATTRDISPLSEQ:
              label: Step display seq.
              title: by default copied to ordinal No of asset
              order: 15
              baseType: INTEGER
              group: STEP
            PROCMODE:
              label: Step ProductMode
              order: 18
              baseType: STRING
              group: STEP
             
  customProperties:
    SOURCE-ID:
      label: Source-ID
      title: ID in source system
      order: 1
      baseType: STRING
      group: SOURCE
    SOURCE-DATATYPE:
      label: Source-datatype
      title: datatype in source system
      order: 5
      baseType: STRING
      group: SOURCE

