BusinessAttribute:
  title:
    de: Eigenschaft, Merkmal einer Entität. Eingeschränkt durch Wertebereich.
    en: Property of an entity. Restricted by a value range (domain).
  properties:
    label:
      label:
        de: Attributname|Attributnamen
        en: Attribute name|Attribute names
    title:
      label:
        de: Kurzbeschrieb (tooltip)
        en: Short description (tooltip)
    dataProtectionCategory:
      layout:
        hidden: true
    identifying:
      layout:
        hidden: true
    cardinality:
      layout:
        width: 4
  customProperties:
    inkeys:
      label:
        de: Schlüsselelement
        en: Key element
      title:
        de: Liste von Entitäts Schlüssel(nummer)n in der das Attribut als Bestandteil vorkommt.
        en: List of entity key(number)s of which the attribute is an element of.
      cardinality: MANY
      baseType: STRING
      layout:       
        position: 10
        width: 6
#    MULTILINGUAL:
#      label: XXMehrsprachig
    multilingual:    
      label: 
       de: Mehrsprachig
       en: Multilingual
      title: 
        de: Ein mehrsprachiges Attribut ist ein Text, der in der Applikation mehrsprachig verwaltet wird.
        en: a multilingual attribute is a text, which is managed in several languages in the destination application
      baseType: BOOLEAN
      layout:
        position: 18
#    Unit:
#      label: XXUnit
    unit:
      label:
        de: phys. Einheit
        en: phys. unit
      title:
        de: Physikalische Einheit des Wertes (nur für Zahlen sinnvoll)
        en: phyiscal unit of value (only makes sense for numbers)
      baseType: STRING
      layout:
        newline: true
        width: 6
        position: 20
#    DefaultValue:
#      label: XXVorgabewert
    defaultValue:
      label: 
        de: Vorgabewert|Vorgabewerte
        en: Default value|Default values
      title: 
        de: Wert, mit dem das Attribut gefüllt wird, im Falle dass leer angeliefert wird
        en: Value with which the attribute is filled if it is supplied empty
      order: 11
      baseType: STRING
      layout:
        newline: false
        width: 6
        position: 21
    
Relationship:
  groups:
    doc:
      label:
        de: Dokumentation
        en: Documentation
      order: 5
  title:
    de: Beziehung zwischen genau 2 Entitäten
    en: Relation between exactly 2 entities
  properties:
    identifying:
      layout:
        hidden: true
    hasDomain:
      label:
        de: 1. Entität
        en: 1. Entity
      title:
        de: Entität, von der die (Vorwärts-)Beziehung ausgeht.
        en: Entity, where the (forward-)relationship starts.
    hasRange:
      label:
        de: 2. Entität
        en: 2. Entity
      title:
        de: Entität, bei  der die (Vorwärts-)Beziehung endet.
        en: Entity, where the (forward-)relationship ends.
    examples:
      group: doc
      layout:
        width: 12
        position: 1
    title:
      group: doc
      layout:
        position: 2
    description:
      group: doc
      layout:
        position: 3
    name:
      label:
        de: Assoziation 1->2
        en: Association 1->2
      title:
        de: Verb, das die 1. mit der 2. Entität verknüpft.
        en: Verb, connection 1. with 2. entity
    rangeMultiplicity:
      layout:
        position: 11
        width: 4
        newline: true
        align: start
    inverseName:
      label:
        de: Assoziation 2->1
        en: Association 2->1
      title:
        de: Verb, das die 2. mit der 1. Entität verknüpft.
        en: Verb, connection 2. with 1. entity
      layout:
        newline: false
        position: 12
        width: 4
    domainMultiplicity:
      layout:
        newline: false
        position: 13
        width: 4
        align: end
    navigable:
      title:
        de: macht nur Sinn für von Rolle oder Subtype oder von funktional abhängigker Entität zum Master 
        en: only makes sense to set an entity that is a role, a subtypea functional dependency
      layout:
        position: 15
    synonyms:
      layout:
        hidden: true
    dataProtectionCategory:
      layout:
        hidden: true
    domainRole:
      layout:
        hidden: true
    rangeRole:
      layout:
        hidden: true
    linksDomain:
      layout:
        hidden: true
    linksRange:
      layout:
        hidden: true                
    rangeAggregation:
      label:
        de: Rolle/Subtyp 2. Entität
        en: Role/Subtype 2. entity
      title:
        de: 1:1 Beziehung verknüpft 2. Entität mit Rolle (optional) oder Subtyp (exklusiv, zwingend)
        en: 1:1 relatioship links 2. entity to role (optional) or subtype (exclusive, mandatory) 
      literals:
        SHARED:
          label: 
            de: Rolle
            en: Role
          title: 
            de: Diese 1:1 Beziehung verknüpft die Entität mit einer (optionalen) Rolle (mit Vererbung)
            en: This 1:1 relationship links the entity with (optional) role (with inheritance)
        COMPOSITE:
          label: 
            de: Subtyp
            en: Subtype
          title: 
            de: Diese 1:1 Beziehung verknüpft die Entität mit einem (exklusiven, zwingenden) Subtyp (mit Vererbung)
            en: This 1:1 relationship links the entity with a (exclusive, mandatory) subtype (with inheritance)
    domainAggregation:
      label:
        de: Rolle/Subtyp 1. Entität
        en: Role/Subtype 1. entity
      title:
        de: 1:1 Beziehung ist Rolle (optional) oder Subtyp (exklusiv, zwingend)
        en: 1:1 relatioship is role (optional) or subtype (exclusive, mandatory) 
      literals:
        SHARED:
          label: 
            de: Rolle
            en: Role
          title: 
            de: Diese 1:1 Beziehung verknüpft die Entität mit einer (optionalen) Rolle (mit Vererbung)
            en: This 1:1 relationship links the entity to (optional) role (with inheritance)
        COMPOSITE:
          label: 
            de: Subtyp
            en: Subtype
          title: 
            de: Diese 1:1 Beziehung verknüpft die Entität mit einem (exklusiven, zwingenden) Subtyp (mit Vererbung)
            en: This 1:1 relationship links the entity to a (exclusive, mandatory) subtype (with inheritance)
  customProperties:
    inkeys:
      label:
        de: Schlüsselelement
        en: Key element
      title:
        de: Liste von Entitäts Schlüssel(nummer)n in der das Attribut als Bestandteil vorkommt.
        en: List of entity key(number)s of which the attribute is an element of.
      cardinality: MANY
      baseType: STRING
      layout:
        width: 6
#    ARC-12:
#      label: XXArc 1->2
#      group: more
#    ARC-21:
#      label: XXArc 2->1      
#      group: more
    exclusiv-1-2:
      label: 
        de: Exklusiv 1->2
        en: Exclusiv 1->2
      title: 
        de: Nr der Gruppe exklusiver Beziehungen, zu der diese Beziehunung gehört. Ausgehend von der 1. Entität
        en: No of group of exclusive relationships, to which this relationship belongs. Starting from the first entity
      order: 5
      group: more
      baseType: INTEGER
      layout:
        width: 6
    exclusiv-2-1:
      label: 
        de: Exklusiv 2->1
        en: Exclusiv 2->1
      title: 
        de: Nr der Gruppe exklusiver Beziehungen, zu der diese Beziehunung gehört. Ausgehend von der 2. Entität
        en: No of group of exclusive relationships, to which this relationship belongs. Starting from the second entity
      order: 5
      baseType: INTEGER
      group: more
      layout:
        width: 6

