# InformationModel.yaml

# configuration of dataspot 
# attributes (and attribute hidings) to make a business data model look like a 
# standard information model
#
# see www.informationmodellierung.ch
#
# some properties are translated as well.
# their translations are in the multilingual yaml-files, marked with "#**IM**"
#
# author: stb
# V2025-12
Theme:
  instances:
    LIGHT:
      appFont: Nunito Sans
      
Asset:
  properties:
    tags:
      layout:
        hidden: true
        
BusinessDataModel:
  label: 
    de: Informationsmodell|Informationsmodelle
    en: Information model|Information models
  title: 
    de: Ein Modell für die fachlichen Namen und Bedeutungen
    en: A model the business names and meanings
  properties:
    synonyms:
      layout:
        hidden: true

  customProperties:  
    #**MULTILINGUAL**
    delimitation:
      label: 
        de: Abgrenzung|Abgrenzungen
        en: Delimitation|Delimitations
      title: 
        de: Semantische Abgrenzung des Elements. Was ist es nicht!
        en: Semantic delimitation of the element. What it is not!
      baseType: TEXT
      layout:
        width: 12
        position: 15
      
Collection:
  properties:
    synonyms:
      layout:
        hidden: true
      
BusinessObject:
  label:
    de: Entität|Entitäten
    en: Entity|Entities
  title:
    de: Ding in der Realität, für dessen Eigenschaften und Beziehungen wir uns interessieren.
    en: Thing in reality, of which we are interested in properties and relations.    
  properties:
    label:
      label:
        de: Entitätsname|Entitätsnamen
        en: Entity name|Entity names
    title:
      label:
        de: Kurzbeschrieb (tooltip)
        en: Short description (tooltip)
