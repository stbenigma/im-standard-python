# multilingualEN.yml

# configuration of dataspot 
# english texts for all describing text fields
#
# mutlilingual elemens added in other configuraions are marked there as **MULTILINGUAL** 
# an here with the yaml file their original property is defined e.g. **InformationModel**
# author: stb
# V2026-06

BusinessDataModel:
  groups:
    EN:
      label: 
        de: Englische Texte
        en: English texts
      order: 5
    
  customProperties:
    #the model must know its main and secondary languages      
    mainlanguage:
      label:
        de: Hauptsprache
        en: Master language
      title:
        de: Sprache in der die offizielle Version formuliert wird.
        en: Language of the official version of any entry.
      order: 10
      layout:
        width: 2
      literals: 
        DE:
          label: de
          order: 1
        EN:
          label: en
          order: 2
        FR:
          label: fr
          order: 3
        IT:
          label: it
          order: 4
        ES:
          label: es
          order: 5
    secondlanguage:
      label:
        de: Sekundärsprachen
        en: Secondary languages
      title:
        de: Sprachen für die Übersetzung von Texten.
        en: Language of the translation of text entries.
      cardinality: MANY
      order: 11
      literals: 
        DE:
          label: de
          order: 1
        EN:
          label: en
          order: 2
        FR:
          label: fr
          order: 3
        IT:
          label: it
          order: 4
        ES:
          label: es
          order: 5

    Label:en:
      label: LABELEN
    labelx:en:
      label: 
        de: Bezeichnung:en
        en: Label:en
      title: 
        de: Englische Bezeichnung des Elementes
        en: English label of the asset 
      baseType: STRING
      group: EN
      order: 5
    Title:en:
      label: TITLEEN
    titlex:en:
      label: 
        de: Titel:en
        en: Title:en
      title: 
        de: Englische Titel (Langbezeichnung) des Elementes
        en: English title (long name) of the asset 
      order: 6
      baseType: STRING
      group: EN
    Description:en:
      label: DESCREN
    descriptionx:en:
      label: 
        de: Beschreibung:en
        en: Description:en
      title: 
        de: Englische Erläuterung des Elementes
        en: English description of the asset 
      order: 7
      baseType: TEXT
      group: EN

    #**InformationModel**
    delimitation:en:
      label: 
        de: Abgrenzung:en
        en: Delimitation:en
      title: 
        de: Semantische Abgrenzung des Elements. Was ist es nicht!
        en: Semantic delimitation of the element. What it is not!
      baseType: TEXT
      layout:
        width: 12
      group: EN
      
