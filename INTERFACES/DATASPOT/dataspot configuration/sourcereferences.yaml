ReferenceDataModel:
# Referenzdatenmodell als Dokumentationsreferenz (vs. enumerations) definieren
  properties:
    stereotype:
      label: Referenzmodelltyp
      labelEn: Type of reference model
      title: Referenztmodelle sind vom Typ Quellenverzeichnis (Standards, Vorgaben, Dokumente) oder Enumerationen (LOV, Datentyp mit vordefinierten Werten)
      titleEn: Reference models are of the type Sources (standards, specifications, documents) or enumerations (LOV, data type with predefined values)
      defaultValue: enumerations
      literals:
        documents:
          label: Quellenverzeichnis
          labelEn: Sources
          icon: book
        enumerations:
          label: Enumeration
          labelEn: Enumeration
          icon: list-tree      
          
