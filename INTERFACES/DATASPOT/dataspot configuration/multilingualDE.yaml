# multilingualDE.yml

# configuration of dataspot 
# german texts for all describing text fields
#
# mutlilingual elemens added in other configuraions are marked there as **MULTILINGUAL** 
# an here with the yaml file their original property is defined e.g. **InformationModel**
#
# author: stb
# V2026-06

BusinessDataModel:
  groups:
    DE:
      label: 
        de: Deutsche Texte
        en: German texts
      order: 5
    
  customProperties:
    #the model must know its main and secondary languages      
    mainlanguage:
      label:
        de: Hauptsprache
        en: Master language
      title:
        de: Sprache in der die offizielle Version formuliert wird.
        en: Language of the official version of any entry.
      order: 10
      layout:
        width: 2
      literals: 
        DE:
          label: de
          order: 1
        EN:
          label: en
          order: 2
        FR:
          label: fr
          order: 3
        IT:
          label: it
          order: 4
        ES:
          label: es
          order: 5
    secondlanguage:
      label:
        de: Sekundärsprachen
        en: Secondary languages
      title:
        de: Sprachen für die Übersetzung von Texten.
        en: Language of the translation of text entries.
      cardinality: MANY
      order: 11
      literals: 
        DE:
          label: de
          order: 1
        EN:
          label: en
          order: 2
        FR:
          label: fr
          order: 3
        IT:
          label: it
          order: 4
        ES:
          label: es
          order: 5

    label:de:
      label: 
        de: Bezeichnung:de
        en: Label:de
      title: 
        de: Deutsche Bezeichnung des Elementes
        en: German label of the asset 
      baseType: STRING
      group: DE
      order: 5
    title:de:
      label: 
        de: Titel:de
        en: Title:de
      title: 
        de: Deutsche Langbezeichnung des Elementes
        en: German title (long name) of the asset 
      order: 6
      baseType: STRING
      group: DE
    description:de:
      label: 
        de: Beschreibung:de
        en: Description:de
      title: 
        de: Deutsche Erläuterung des Elementes
        en: German description of the asset 
      order: 7
      baseType: TEXT
      group: DE

    #**InformationModel**
    delimitation:de:
      label: 
        de: Abgrenzung:en
        en: Delimitation:en
      title: 
        de: Semantische Abgrenzung des Elements. Was ist es nicht!
        en: Semantic delimitation of the element. What it is not!
      baseType: TEXT
      layout:
        width: 12
      group: DE
      
