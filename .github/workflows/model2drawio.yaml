name: Build model2drawio distribution from Jupyter Notebook

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.8
      uses: actions/setup-python@v2
      with:
        python-version: 3.8
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        conda env update --file conda-base-environment.yaml --name base
#    - name: Lint with flake8
#      run: |
#        conda install flake8
#        # stop the build if there are Python syntax errors or undefined names
#        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
#        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
#        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        conda install pytest
        pytest

    # Integration test prerequisites
    - name: Clone reference model repository
        uses: actions/checkout@v2
        with:
          repository: foryouandyourcustomers/fyyccim-refmodels
          path: testdata/fyyccim-refmodels
    - name: Build deployment package
      run: |
        python deploy.py

    # Run integration test
    - name: Test run generator
      run: |
        python generator.py --version

    - name: Integration test run with CRM model
      run: |
        python generator.py --model testdata/fyyccim-refmodels/CRM/IM

    - name: Upload packed deployment to github
      uses: xresloader/upload-to-github-release@v1.3.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        file: model2diagram.zip
        draft: true
        tag_name: model2drawio-${{github.ref_name}}
