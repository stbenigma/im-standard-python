name: Quality
# Quality assurance on every push to GitHub.
# Includes SSOT generation for all IM's in fyyccim-refmodels.

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    #    strategy:
    #      max-parallel: 5
    #      matrix: ''

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        # Using 3.9 as the default for github conda image -> faster
        python-version: 3.9

    - name: Install GNU gettext
      # msgfmt is required by some unittests
      run: sudo apt install gettext

    - name: Overview of toolcache
      run: find /opt/hostedtoolcache -type d -maxdepth 2
      continue-on-error: true

    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH

    - name: Show current conda environment configuration
      run: |
        conda env export --name base

    - name: Install dependencies
      run: |
        conda env update --file conda-base-environment.yaml --name base

    - name: Unitttests with pytest
      run: |
        conda install pytest
        pytest -m "not integration"

    - name: Lint with flake8
      run: |
        conda install flake8
        flake8 . --max-line-length=120 --count --max-complexity=10 --statistics --exit-zero
    #        # stop the build if there are Python syntax errors or undefined names
    #        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    #        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
    #        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Build deployment package
      run: |
        python pythonWork/pythonSource/tools/deploy.py

    # Run integration test
    - name: Test run generator
      run: |
        python dist/generator.py --version

    - name: Integration test run with riddle model located within same git repo
      run: |
        python dist/generator.py --dont-merge --languages 'en' --model pythonWork/pythonSource/testenvironment/testmodels/riddle/IM

      # Integration test prerequisites
    - name: Clone reference model repository using fycops token
      uses: actions/checkout@v2
      with:
        repository: foryouandyourcustomers/fyyccim-refmodels
        token: ${{ secrets.FYYCCIM_REFMODELS_KEY }}
        path: testdata/fyyccim-refmodels

    - name: Integration test run with raetsel-3lang model
      run: |
        python dist/generator.py --dont-merge --model testdata/fyyccim-refmodels/raetsel-3lang/IM

    - name: Integration test run with CRM model
      run: |
        python dist/generator.py --dont-merge --model testdata/fyyccim-refmodels/CRM/IM

    - name: Integration test run with PIM model
      run: |
        python dist/generator.py --dont-merge --languages 'en' --model testdata/fyyccim-refmodels/PIM/IM

    - name: Integration test run with Health model
      run: |
        python dist/generator.py --dont-merge --languages 'en' --model testdata/fyyccim-refmodels/Health/IM

    - name: Integration test run with BOEB model
      run: |
        git -C testdata/fyyccim-refmodels fetch -v
        git -C testdata/fyyccim-refmodels checkout -f BOEB-IM
        python dist/generator.py --dont-merge --languages 'en' --model testdata/fyyccim-refmodels/BOEB/IM

    - name: Integration test run with raetse-3lang 1.5 schema DB -> upgrade
      run: |
        git -C testdata/fyyccim-refmodels checkout -f master
        cp testdata/db-schema-versions/raetsel-3lang-1.5.db testdata/fyyccim-refmodels/raetsel-3lang/DB/raetsel-3lang.db
        python dist/generator.py --model testdata/fyyccim-refmodels/raetsel-3lang/IM


    - name: Execute integration tests
      run: pytest -m "integration"

    - name: Install and run Coverage.py
      run: |
        conda install coverage
        coverage run -m pytest
        coverage report -m
